# ember's web UI.
#
# WHY THERE IS RUST IN A GO-FIRST REPOSITORY: it was asked for deliberately,
# and AGENTS.md carries the written reason for every dependency added here.
# What this file does is contain the cost -- nothing in internal/ imports
# anything from web/, and `go build ./...` works on a clean clone with no Rust
# installed, because internal/webapi/dist holds a committed placeholder.
[package]
name = "ember-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "ember's local web UI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fine-grained signals rather than a vdom, which is the reason for choosing
# it: a sampling-step event updates one text node instead of diffing a tree,
# and progress arrives several times a second on a watched generation.
leptos = { version = "0.8", features = ["csr"] }

# PINNED EXACTLY, because wasm-bindgen's generated glue has to match the
# wasm-bindgen CLI that post-processes it -- a mismatch is a hard error at
# build time, not a subtle one. `make web` checks the two agree and says which
# to change. "Pin external inputs" is already the rule here.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# fetch and WebSocket straight from web-sys rather than through a helper
# crate: about eighty lines in api.rs against another dependency tree.
[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Location", "Document", "Element", "HtmlElement",
  "Request", "RequestInit", "RequestMode", "Response", "Headers",
  "WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "Event",
  "AbortController", "AbortSignal",

  # The file picker. FEATURES AND NOT A CRATE, which is the whole reason
  # web-sys is here rather than a wrapper: an <input type=file> needs the
  # element type, the FileList it holds and Blob::array_buffer to read one.
  #
  # NO FileReader. Blob::array_buffer returns a Promise, which
  # wasm-bindgen-futures already turns into something awaitable -- a
  # FileReader needs an onload closure kept alive for exactly as long as the
  # read, which is the shape api::Socket has to do by hand for the websocket
  # and the bug class it carries (a dropped closure is a callback the browser
  # never calls again).
  "HtmlInputElement", "FileList", "File", "Blob",

  # The router. FEATURES AND NOT A CRATE again, and this is the entry #139
  # weighed `leptos_router` against: two names here, against a crate that is
  # in no lockfile in this repository and would arrive with its own tree, for
  # a pathname read into a signal, a click that pushes state and a listener
  # that reads it back.
  #
  # DECLARED ALTHOUGH THE BUILD ALREADY COMPILED WITHOUT THEM, because cargo
  # features are additive across the graph: `leptos` enables both for its own
  # reasons, so `web/` was spending somebody else's feature selection. That is
  # the `// indirect` marker read as evidence -- a dependency's choice standing
  # in for this crate's, which holds only until the day that crate narrows it.
  "History", "PopStateEvent",
]

[profile.release]
# Size, not speed: this is a few thousand lines of UI logic shipped over
# loopback, and every millisecond of the browser's parse is paid on each
# reload. opt-level "s" plus lto takes the wasm well under a megabyte.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
