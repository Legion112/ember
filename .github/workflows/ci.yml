name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: test, lint, build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the build below stamps `ember version` from
      # `git describe`, and actions/checkout fetches one commit with no tags by
      # default -- so a build of a tagged commit would report the bare
      # revision, which is this stamp's fallback rather than its answer. There
      # are no release tags here yet, so this changes nothing until the first
      # one lands, which is also when a wrong version would be noticed latest.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # go-version-file rather than a literal, so the toolchain cannot drift
      # from what the module declares.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # The dependency list in AGENTS.md and the direct requirements in go.mod
      # have to say the same thing, and until this step nothing checked that
      # they did: `go build` adds a requirement without fixing its
      # `// indirect` marker, so four deliberate dependencies sat recorded as
      # nobody's decision. It matters because TestOTelStaysIndirect reads that
      # marker as the evidence for #33's refusal of an OpenTelemetry SDK.
      #
      # Asked of make for the reason the vet step below gives at length, and
      # the Makefile target carries the rest of the argument -- including why
      # this is not a Go test (it resolves modules, and `go test ./...` must
      # need no network) and why the module cache makes that resolution free
      # here. It runs before vet because it is the cheapest gate in the job
      # and the one whose failure has a one-line fix.
      - name: go.mod is tidy
        run: make tidy-check

      # Asked of make rather than spelled here, the way the publishing
      # workflow asks it for the image tag. This step used to write out
      # `-tags='integration imagelab'` itself, which made three
      # hand-maintained copies of one list -- and the fourth copy, in
      # .golangci.yml, was the one that never learned about `imagelab`, so the
      # image labs were linted nowhere for their whole life. The Makefile's
      # LAB_TAGS is the only list now, and a test fails when it or
      # .golangci.yml misses a tag the tree uses.
      #
      # The "are there lab sources yet" condition went with it: the recipe
      # vets the tagged tree unconditionally, because a skip is a silent pass
      # the moment somebody moves those files.
      - name: vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: unit tests
        run: |
          set -o pipefail
          go test -race -count=1 -v \
            -coverpkg=./internal/...,./cmd/... \
            -coverprofile=coverage.out ./... 2>&1 | tee /tmp/unit.log

      # A test that skips itself reports success for something that never ran.
      # go-tun applies this to its labs; ember applies it to unit tests too,
      # because the host-key and bind guards are exactly the tests somebody
      # would be tempted to skip on a machine where they are inconvenient.
      - name: no unit test silently skipped
        if: always()
        run: |
          if grep -q -- '--- SKIP' /tmp/unit.log; then
            echo "::error::a unit test skipped itself instead of running:"
            grep -B1 -- '--- SKIP' /tmp/unit.log
            exit 1
          fi

      - name: coverage gate
        run: make cover-check

      # Through make, so the -ldflags stamp is wired in one place rather than
      # two. This step used to be a bare `go build`, which is how `ember
      # version` printed `dev` out of CI as well as out of a laptop; the
      # Makefile's VERSION comment has the whole argument.
      #
      # The version is echoed because the one thing this step cannot catch is
      # an -X that silently stamped nothing: the symbol check is a unit test,
      # and this is the log line that shows the result.
      - name: build
        run: |
          make build
          ./bin/ember version

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # The web UI, which is the one thing in this repository that is not Go.
  #
  # Its own job rather than steps in the unit one, so a Rust toolchain is not
  # installed for a change that does not touch it -- and so a red frontend
  # does not read as a red backend. `go build ./...` deliberately does not
  # depend on any of this: internal/webapi/dist carries a committed
  # placeholder, because //go:embed fails at compile time on a pattern that
  # matches nothing.
  web:
    name: web ui
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the version stamp, as in the unit job above: this
      # job also builds a binary and prints what it calls itself.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The pinned wasm-bindgen CLI, read out of web/Cargo.toml rather than
      # written here: two copies of a version is two copies that drift, and
      # the one that drifts produces glue the other cannot process.
      - name: toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add clippy rustfmt
          version=$(make print-WASM_BINDGEN_VERSION)
          echo "pinned wasm-bindgen: $version"
          cargo install -f wasm-bindgen-cli --version "$version"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      # fmt, clippy and the host tests -- what vet, lint and test are to the
      # Go half. The tests run on the HOST and not in a browser, which is why
      # internal/model has no web_sys in it.
      - name: checks
        run: make web-test

      - name: build
        run: make web

      # The Go build with the UI embedded, which is the combination a release
      # actually ships and which nothing else here exercises: the unit job
      # builds against the placeholder.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build ember with the UI in it
        run: |
          make build
          ./bin/ember version

  # The labs run ember's real binary against a real Docker daemon. That is
  # where the Docker client in internal/dockerengine/dockerclient runs at all
  # -- the coverage gate excludes it as a branchless adapter -- and it is the
  # only place a SIGKILL mid-provision can produce the orphan that `ember ls`
  # and `ember reap` exist to find.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Vetting the tagged tree, because the default invocation never looks at
      # code behind a build tag: go-tun learned that the hard way, with a lab
      # that had not compiled for weeks. Through make for the reason the unit
      # job's vet step gives -- this was one of the three copies of the tag
      # list, and the copies are what let `imagelab` miss .golangci.yml.
      - name: vet the tagged tree
        run: make vet

      - name: build the lab image
        run: make docker-build

      - name: labs
        run: |
          set -o pipefail
          EMBER_INTEGRATION=1 go test -tags=integration -count=1 -timeout 20m -v \
            ./test/integration/... 2>&1 | tee /tmp/labs.log

      # A silently skipped lab is worse than a red build: it reports success
      # for a security control that never ran. The labs themselves refuse to
      # skip -- a missing daemon or image is a hard failure naming the command
      # that fixes it -- and this is the second line of defence.
      - name: no lab silently skipped
        if: always()
        run: |
          if grep -q -- '--- SKIP' /tmp/labs.log; then
            echo "::error::a lab skipped itself instead of running:"
            grep -B1 -- '--- SKIP' /tmp/labs.log
            exit 1
          fi

      # Nothing ember created may outlive the job. Each lab asserts this for
      # itself in its own cleanup; this catches a lab that failed before
      # registering one.
      - name: no stray containers
        if: always()
        run: |
          left=$(docker ps -aq --filter label=ember.run-id)
          if [ -n "$left" ]; then
            echo "::error::containers wearing ember's label outlived the labs:"
            docker ps -a --filter label=ember.run-id
            exit 1
          fi
