name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: test, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # go-version-file rather than a literal, so the toolchain cannot drift
      # from what the module declares.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # vet twice once the lab exists. The default invocation never looks
      # behind a build tag, so without the tagged run the integration lab
      # compiles only on whichever machine happens to run it.
      - name: vet
        run: |
          go vet ./...
          # The directory exists before the labs do -- it holds the
          # Dockerfile -- and `go vet` exits 1 on "matched no packages", so
          # the condition is "is there Go here", not "is there a directory".
          if ls test/integration/*.go >/dev/null 2>&1; then
            go vet -tags=integration ./test/...
            # And behind the second tag. Nothing else compiles the image labs:
            # the job below runs only -tags=integration, and the workflow that
            # uses them is dispatch-only -- so a file that stopped compiling
            # would not be noticed until a publish, after a twenty-minute
            # build. That is exactly how "ember:lab is missing" reached one.
            go vet -tags='integration imagelab' ./test/...
          else
            echo "no lab sources yet; skipping the tagged vet"
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: unit tests
        run: |
          set -o pipefail
          go test -race -count=1 -v \
            -coverpkg=./internal/...,./cmd/... \
            -coverprofile=coverage.out ./... 2>&1 | tee /tmp/unit.log

      # A test that skips itself reports success for something that never ran.
      # go-tun applies this to its labs; ember applies it to unit tests too,
      # because the host-key and bind guards are exactly the tests somebody
      # would be tempted to skip on a machine where they are inconvenient.
      - name: no unit test silently skipped
        if: always()
        run: |
          if grep -q -- '--- SKIP' /tmp/unit.log; then
            echo "::error::a unit test skipped itself instead of running:"
            grep -B1 -- '--- SKIP' /tmp/unit.log
            exit 1
          fi

      - name: coverage gate
        run: make cover-check

      - name: build
        run: go build -o bin/ember ./cmd/ember

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # The labs run ember's real binary against a real Docker daemon. That is
  # where the Docker client in internal/dockerengine/dockerclient runs at all
  # -- the coverage gate excludes it as a branchless adapter -- and it is the
  # only place a SIGKILL mid-provision can produce the orphan that `ember ls`
  # and `ember reap` exist to find.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Vetting the tagged tree separately, because the default invocation
      # never looks at code behind a build tag: go-tun learned that the hard
      # way, with a lab that had not compiled for weeks.
      - name: vet the tagged tree
        run: |
          go vet -tags=integration ./test/...
          go vet -tags='integration imagelab' ./test/...

      - name: build the lab image
        run: make docker-build

      - name: labs
        run: |
          set -o pipefail
          EMBER_INTEGRATION=1 go test -tags=integration -count=1 -timeout 20m -v \
            ./test/integration/... 2>&1 | tee /tmp/labs.log

      # A silently skipped lab is worse than a red build: it reports success
      # for a security control that never ran. The labs themselves refuse to
      # skip -- a missing daemon or image is a hard failure naming the command
      # that fixes it -- and this is the second line of defence.
      - name: no lab silently skipped
        if: always()
        run: |
          if grep -q -- '--- SKIP' /tmp/labs.log; then
            echo "::error::a lab skipped itself instead of running:"
            grep -B1 -- '--- SKIP' /tmp/labs.log
            exit 1
          fi

      # Nothing ember created may outlive the job. Each lab asserts this for
      # itself in its own cleanup; this catches a lab that failed before
      # registering one.
      - name: no stray containers
        if: always()
        run: |
          left=$(docker ps -aq --filter label=ember.run-id)
          if [ -n "$left" ]; then
            echo "::error::containers wearing ember's label outlived the labs:"
            docker ps -a --filter label=ember.run-id
            exit 1
          fi
