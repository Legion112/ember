name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: test, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # go-version-file rather than a literal, so the toolchain cannot drift
      # from what the module declares.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # vet twice once the lab exists. The default invocation never looks
      # behind a build tag, so without the tagged run the integration lab
      # compiles only on whichever machine happens to run it.
      - name: vet
        run: |
          go vet ./...
          if [ -d test/integration ]; then go vet -tags=integration ./test/...; fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: unit tests
        run: |
          set -o pipefail
          go test -race -count=1 -v \
            -coverpkg=./internal/...,./cmd/... \
            -coverprofile=coverage.out ./... 2>&1 | tee /tmp/unit.log

      # A test that skips itself reports success for something that never ran.
      # go-tun applies this to its labs; ember applies it to unit tests too,
      # because the host-key and bind guards are exactly the tests somebody
      # would be tempted to skip on a machine where they are inconvenient.
      - name: no unit test silently skipped
        if: always()
        run: |
          if grep -q -- '--- SKIP' /tmp/unit.log; then
            echo "::error::a unit test skipped itself instead of running:"
            grep -B1 -- '--- SKIP' /tmp/unit.log
            exit 1
          fi

      - name: coverage gate
        run: make cover-check

      - name: build
        run: go build -o bin/ember ./cmd/ember

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # The `integration` job lands with the Docker lab it runs. It is absent
  # rather than skipped on purpose: a job that passes because the thing it
  # tests does not exist is a green tick that means nothing, and
  # `make test-integration` already stands in the Makefile as the reminder.
  # See AGENTS.md, "a test that skips itself reports success for something
  # that never ran".
