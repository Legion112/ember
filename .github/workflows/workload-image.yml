# Publishes the CUDA workload image: a node that can generate on a GPU.
#
# Built in CI rather than on a laptop for two reasons. The token already has
# the scope, so nobody holds a registry credential locally; and the image is
# several gigabytes, which a home upload link makes painful while a runner
# pushes it inside GitHub's own network.
#
# Manual only. Compiling stable-diffusion.cpp against the CUDA toolkit takes
# tens of minutes, and nothing in it changes when a Go file does.
#
# It no longer bakes in a checkpoint. Weights go on a store, which is why this
# workflow stopped needing a model URL, a digest to verify it with, and the
# disk to hold all three copies.
name: workload image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        required: true
        default: sd-cuda

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # No "make room" step. It used to delete .NET, Android and GHC before
      # building, because a CUDA devel base plus the build tree plus the
      # final image plus a 1.76 GB checkpoint was thought not to fit.
      #
      # The log says otherwise: the last run that did it reported 86 GB free
      # before the cleanup and 111 GB after, having spent two and a half
      # minutes to free space nothing needed. Without the model baked in
      # there is even less to hold. Removed rather than kept "just in case" --
      # a precaution nobody can point at a failure for is one that just makes
      # every build slower.

      - name: resolve the image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/ember-sd" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Built into the local daemon first, verified, and only then pushed.
      #
      # The assertions are about this image -- that it binds nothing but 22,
      # that it carries no weights, that its embernode understands the
      # subcommands ember invokes, and that its CUDA architectures cover the
      # cards ember can rent -- so this is where they belong. Run in CI
      # instead they would need a forty-minute compile on every pull request;
      # run after the push they would find a bad image that had already
      # shipped.
      #
      # Built exactly once. This used to build twice -- once to load and once
      # to push -- and the measured cost of the second was 11 seconds, because
      # it hit the builder cache. It is gone anyway: the image that gets
      # tested is now literally the image that gets pushed, rather than one
      # the cache promises is identical.
      #
      # cache-from/cache-to is the change that matters here. The sdbuild stage
      # compiles stable-diffusion.cpp and all of ggml's CUDA kernels, keyed on
      # nothing but SD_COMMIT and CUDA_ARCHS, and without a cache it ran from
      # scratch on every dispatch: 1846 seconds, measured, against a 90-minute
      # timeout. That cost is why the architecture list was kept too narrow to
      # include the cards worth renting.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workload-sd-cuda.Dockerfile
          load: true
          push: false
          tags: ember:sd-cuda
          cache-from: type=gha
          # ignore-error because a cache is an optimisation. The export
          # talking to the Actions cache service is not a reason to throw
          # away a thirty-minute compile that succeeded.
          cache-to: type=gha,mode=max,ignore-error=true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The lab set lives in the Makefile, not here.
      #
      # It used to be an expression in this file, and it drifted: a lab was
      # added specifically to catch a published image whose embernode did not
      # understand `embernode fetch`, and this `-run` never named it. The one
      # publish it existed to guard was the one place it did not run. Both
      # publish paths now ask make for the same set.
      #
      # The video lab is not in it: it has to run sd-cli, and the CUDA binary
      # needs libcuda.so.1 which this runner has no GPU to provide. It runs
      # against the CPU build, which carries the same binary from the same
      # pinned revision -- an agreement the ordinary lab suite checks on every
      # pull request.
      - name: verify the image before publishing it
        # docker-build first: the harness needs ember:lab for its own node, and
        # the lab target checks for it rather than building it, the way every
        # other image lab target does. `make publish-sd-cuda` gets it as a
        # prerequisite; a runner has to ask for it.
        run: make docker-build test-image-labs-publish

      # Tagged and pushed, rather than built a second time. The bytes that
      # were just tested are the bytes that ship.
      - name: publish
        id: build
        run: |
          docker tag ember:sd-cuda "$IMAGE:${{ inputs.tag }}"
          docker tag ember:sd-cuda "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ inputs.tag }}"
          docker push "$IMAGE:${{ github.sha }}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ inputs.tag }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: report what to put in ember.yaml
        run: |
          echo "### workload image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "image: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
