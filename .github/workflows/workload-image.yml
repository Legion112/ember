# Publishes the CUDA workload image: a node that can generate on a GPU.
#
# Built in CI rather than on a laptop for two reasons. The token already has
# the scope, so nobody holds a registry credential locally; and the image is
# several gigabytes, which a home upload link makes painful while a runner
# pushes it inside GitHub's own network.
#
# Manual only. Compiling stable-diffusion.cpp against the CUDA toolkit takes
# tens of minutes, and nothing in it changes when a Go file does.
#
# It no longer bakes in a checkpoint. Weights go on a store, which is why this
# workflow stopped needing a model URL, a digest to verify it with, and the
# disk to hold all three copies.
name: workload image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        required: true
        default: sd-cuda

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # No "make room" step. It used to delete .NET, Android and GHC before
      # building, because a CUDA devel base plus the build tree plus the
      # final image plus a 1.76 GB checkpoint was thought not to fit.
      #
      # The log says otherwise: the last run that did it reported 86 GB free
      # before the cleanup and 111 GB after, having spent two and a half
      # minutes to free space nothing needed. Without the model baked in
      # there is even less to hold. Removed rather than kept "just in case" --
      # a precaution nobody can point at a failure for is one that just makes
      # every build slower.

      - name: resolve the image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/ember-sd" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Built into the local daemon first, verified, and only then pushed.
      #
      # The assertions are about this image -- that it binds nothing but 22,
      # and that it carries no weights -- so this is where they belong. Run
      # in CI instead they would need a forty-minute compile on every pull
      # request; run after the push they would find a bad image that had
      # already shipped.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workload-sd-cuda.Dockerfile
          load: true
          push: false
          tags: ember:sd-cuda

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: verify the image before publishing it
        run: |
          # Two assertions, and both run against the image this job just
          # built: it binds nothing but 22, and it carries no weights. The
          # first is what the platform-port concession rests on -- RunPod
          # publishes 19123 to the world on every pod and ember tolerates it
          # only because nothing in the image listens there.
          #
          # The third image lab, video support, is not here: it has to run
          # sd-cli, and the CUDA binary needs libcuda.so.1 which this runner
          # has no GPU to provide. It runs against the CPU build, which
          # carries the same binary from the same pinned revision -- an
          # agreement the ordinary lab suite checks on every pull request.
          #
          # The harness needs ember:lab for its own node, and that is the
          # cheap image.
          docker build -t ember:lab -f node.Dockerfile .
          EMBER_INTEGRATION=1 go test -tags='integration imagelab' -count=1 -v \
            ./test/integration/... \
            -run 'TestWorkloadImage_(ListensOnNothingButSSH|CarriesNoWeights)' \
            | tee /tmp/labs.log
          if grep -q -- '--- SKIP' /tmp/labs.log; then
            echo "::error::a lab skipped itself"; exit 1
          fi

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: workload-sd-cuda.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: report what to put in ember.yaml
        run: |
          echo "### workload image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
