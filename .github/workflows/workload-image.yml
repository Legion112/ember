# Publishes the CUDA workload image: a node that can generate on a GPU.
#
# Built in CI rather than on a laptop for two reasons. The token already has
# the scope, so nobody holds a registry credential locally; and the image is
# several gigabytes, which a home upload link makes painful while a runner
# pushes it inside GitHub's own network.
#
# Manual only. It is expensive to build and the model it bakes in rarely
# changes, so rebuilding it on every push to master would burn runner minutes
# for nothing.
name: workload image

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: GGUF checkpoint to bake in
        required: true
        default: https://huggingface.co/kostakoff/stable-diffusion-v1-5-GGUF/resolve/main/v1-5-pruned_bf16.gguf
      model_sha256:
        description: sha256 of that file, so a moved URL cannot change the node
        required: true
        default: ""
      tag:
        description: image tag
        required: true
        default: sd-cuda

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # A CUDA devel base plus the build tree plus the final image does not
      # fit in a runner's default free space. The preinstalled toolchains are
      # several tens of gigabytes and nothing here uses them.
      - name: make room
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: resolve the image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/ember-sd" >> "$GITHUB_ENV"

      # Verified by digest. A checkpoint fetched from a moving URL is a node
      # whose output changes without anything in this repository changing.
      - name: fetch the model
        run: |
          curl -sSL --retry 3 -o .model.gguf "${{ inputs.model_url }}"
          echo "${{ inputs.model_sha256 }}  .model.gguf" | sha256sum -c -
          ls -la .model.gguf

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: workload-sd-cuda.Dockerfile
          push: true
          build-args: MODEL_PATH=.model.gguf
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: report what to put in ember.yaml
        run: |
          echo "### workload image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
