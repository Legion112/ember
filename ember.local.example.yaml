# ember, generating on the GPU in this machine.
#
# The same assets and digests as ember.flux2.yaml with the provider changed
# and --offload-to-cpu added: weights in system RAM, streamed into VRAM per
# layer. Not fast, and free, which is what prompt iteration wants.
#
# WHY IT IS SLOW, why the geometry is 1024 and not 1536, and why `verify` is
# `present` here and `always` on the rented path: docs/configurations.md.

provider: local

# Built for the card in this machine. `make workload-sd-cuda-local` reads the
# compute capability from nvidia-smi and builds for exactly that, under the
# ordinary per-architecture tag -- so adjust the number below if the card here
# is not an sm_75.
#
# A scalar image: rather than an images: map, because a local run has exactly
# one card and knows which.
image: ember:sd-cuda-sm75

ttl: 4h

# What the local provider reports for this machine's card, from nvidia-smi.
# `ember offers` prints it.
min_vram_gib: 8

# A store here is a Docker named volume: the same code path a rented network
# volume uses, costing nothing and surviving between runs.
store:
  name: models
  size_gib: 70
  mount: /models

assets:
  - url: https://huggingface.co/city96/FLUX.2-dev-gguf/resolve/main/flux2-dev-Q8_0.gguf
    sha256: 09d005300dd8dcbbd489bb75ada6254145c84c2c9c3d7cc1829e3c5dedcb42ce
    as: flux2-dev-Q8_0.gguf

  - url: https://huggingface.co/unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF/resolve/main/Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
    sha256: b2a40e5ef4eab8837d0462c303e8147ec754e2963e41916b551107d2b0ca6527
    as: Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf

  - url: https://huggingface.co/black-forest-labs/FLUX.2-small-decoder/resolve/main/full_encoder_small_decoder.safetensors
    sha256: ea4273f02d1fafbf8e1d1c2cf6018ed8748652eb0bf34f2dd91171f16f15ab62
    as: flux2-ae.safetensors

# present, not always: nothing else writes a Docker volume on this machine, so
# the cross-run channel the rented path re-hashes 56 GiB against does not
# exist here -- and re-reading it off this disk before every iteration would
# make the free path the slow one to start.
verify: present

# The same two-question probe the rented config carries, and it matters more
# here: the published image genuinely cannot run on the wrong card, and this
# is what turns that into a refusal instead of a silent CPU fallback. An empty
# /etc/ember-cuda-arch FAILS the test rather than passing it.
gpu_probe:
  - sh
  - -c
  - "arch=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d ' .'); img=$(cat /etc/ember-cuda-arch 2>/dev/null); echo \"card is sm_$arch, image is sm_$img\"; test -n \"$img\" && test \"$arch\" = \"$img\" && sd-cli --list-devices | grep -qi cuda"
gpu_probe_timeout: 1m

cmd:
  - sd-cli
  - --diffusion-model
  - /models/flux2-dev-Q8_0.gguf
  - --llm
  - /models/Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
  - --vae
  - /models/flux2-ae.safetensors

  # The whole reason this configuration is possible: 56 GiB of weights in a
  # 125 GiB machine behind an 11 GiB card.
  - --offload-to-cpu

  - --prompt
  - "A detailed anime illustration of a young woman alone on the open-air platform of a rural railway station at dusk. Cel-shaded with crisp linework, warm rim light from the setting sun behind her, cool blue tones in the shadows."
  - --sampling-method
  - euler
  - --cfg-scale
  - "1.0"
  - --guidance
  - "4.0"
  - --steps
  - "28"

  # 1024, not 1536: the DiT's compute buffer alone was 4412 MiB at 1536x1536
  # on a card with 80 GiB to spare. Raise it once a run has proved it fits.
  - -W
  - "1024"
  - -H
  - "1024"

  - --seed
  - "20261030"
  - --diffusion-fa
  - -v
  - -o
  - /workspace/out/local.png

outputs:
  - /workspace/out:renders
