# The one committed configuration. Copy it to ember.yaml, which every command
# reads by default.
#
# THERE USED TO BE FOUR, and they differed in what a workload is rather than in
# what an operator wants: the starter, the rented FLUX.2 one, the same weights
# on the card in this machine, and the free sd15 one the web UI runs on. An
# operator choosing between four files is choosing before they know which
# question they are asking, and three of the four are then wrong about their
# machine. This file declares them as entries instead, so the choice is
# `--workload` on a command or a tab in the browser.
#
# Safe to commit: no credentials live here. Tokens come from the environment
# (RUNPOD_API_KEY, VAST_API_KEY) or from ~/.config/ember/credentials.yaml at
# mode 0600, which ember refuses to read if it is any looser.
#
# What each entry measured, and the per-image cost table that decides a resident
# server: docs/configurations.md.
#
# LICENCE: FLUX.2 [dev] is non-commercial. This repository's MIT licence does
# not extend to the output of the `flux2` entry.

# The default for a command that names no provider. `local` and not `runpod`,
# because the cheapest mistake is the one that rents nothing: `ember up
# --provider runpod --workload flux2` is the paid path, named out loud.
#
# A request over HTTP names its own provider, and the web UI offers every
# provider the registry holds -- so this line is the CLI's default and not a
# lock on the file.
provider: local

# Mandatory, and the ceiling on what a wedged run can cost. The node destroys
# itself at this deadline even if ember never gets to, which is what stops the
# bill when the laptop dies mid-run. Each entry may narrow or widen it for its
# own shape; this is what an entry that says nothing inherits.
ttl: 30m

# Integer microdollars underneath, so the comparison is exact: a float would
# refuse an offer at exactly the ceiling about as often as it admitted one
# above it. max_hourly_usd bounds the card, max_run_usd the whole rental.
#
# Set from the `flux2` entry, which is the only one that can spend: the local
# provider is free, so a ceiling on it bounds nothing.
max_hourly_usd: "2.60"
max_run_usd: "3.00"

# max_day_usd and max_month_usd bound every rental in a UTC calendar day or
# month TOGETHER, which neither line above does -- thirty queued requests at
# $3.00 each are inside both and are $90. Read by `ember serve` only, where a
# queue drains unattended, and a request can neither widen nor narrow them.
# Commented out because an unbounded queue is what ember did before they
# existed; set the month one if you set only one.
#
# max_day_usd: "10.00"
# max_month_usd: "100.00"

# Fetched from the node before it dies, as remote or remote:local.
#
# /workspace and never the store: anything written to a mounted volume bills by
# the month for as long as the store exists. The images do not come this way --
# they arrive in the HTTP response as each job finishes.
outputs:
  - /workspace/out:logs

workloads:
  # Free, on the card in this machine, and the entry the web UI is for.
  #
  # NO STORE AND NO ASSETS, which is the whole reason this is an entry and not
  # a file: `ember:sd` carries sd-server, sd-cli and a baked sd15, so there is
  # nothing to download and nothing billing by the month. A shared `store:`
  # would have made the free path create a volume.
  - id: free
    # NOT "Free", WHICH IS WHAT THIS SAID AND WAS MISLEADING. `flux2-local`
    # is equally free -- both run on the local provider, where the card is this
    # machine's and a Docker volume costs nothing -- so a label promising free
    # on one of them implies the other is not. The only entry that spends money
    # is `flux2`, and its label says rented. What separates these two is the
    # model and what it takes to start: sd15 is baked into the image and serves
    # in two minutes, where FLUX.2 is 56 GiB to fetch once and twenty minutes
    # to load.
    label: sd15 (this machine)
    driver: sd
    image: ember:sd

    # No gpu_probe either. The baked image is the CPU build, so asking
    # nvidia-smi which architecture it is would fail a card that was never
    # claimed -- `make workload-sd MODEL=/path/to/v1-5-pruned_bf16.gguf` builds
    # it and `make web` builds the page.
    sd:
      # ember appends --listen-ip 127.0.0.1 --listen-port 1234 itself and
      # refuses a serve command that names either: a config choosing 0.0.0.0
      # would publish an unauthenticated generator on this machine's LAN.
      #
      # --model and NOT --diffusion-model: this is a whole checkpoint in one
      # file. --diffusion-model is for a standalone DiT, which is what FLUX.2
      # needs, and the flag that works for one silently cannot load the other.
      serve:
        - sd-server
        - --model
        - /opt/models/sd15.gguf

      # A laptop CPU loads sd15 in a few seconds. The ten-minute default is
      # right for 56 GiB off a network volume and far too patient here: a
      # server that died wants noticing now, not at the deadline.
      ready_timeout: 2m

      # `proj` projects the latent rather than decoding it, so it costs almost
      # nothing per frame; tae and vae run a real decode. Every 2 steps rather
      # than ember's usual 5, because a generation here is short enough that 5
      # would produce one frame and nothing to watch.
      preview: proj
      preview_interval: 2

      # `ember serve` replaces this with whatever the browser queues, so it is
      # a placeholder -- but it cannot be empty: ParseSD refuses a server with
      # no jobs, because that configuration rents a card, loads the weights and
      # generates nothing.
      jobs:
        - prompt: "a rural railway station at dusk, warm light, cel-shaded"
          width: 384
          height: 384
          steps: 20
          sampler: euler
          seed: 20261101
          output: station

  # The same FLUX.2 weights and the same digests, on the card in this machine.
  #
  # THE THIRD FILE THAT BECAME AN ENTRY, and the one that proves the widening
  # was needed: it differs from `flux2` in nothing a driver reads. Same images
  # block in spirit, same assets, same serve argv -- and a different store, a
  # different VRAM floor, a different verify policy, a different TTL and a
  # different probe timeout. Those are exactly the six keys an entry carries
  # now; with only `image`/`sd` per entry this had to be its own file.
  #
  # Not fast, and free, which is what prompt iteration wants: 56 GiB of weights
  # in system RAM behind an 11 GiB card, streamed into VRAM a layer at a time.
  - id: flux2-local
    label: FLUX.2 [dev] (this machine)
    driver: sd

    # Built for the card here. `make workload-sd-cuda-local` reads the compute
    # capability from nvidia-smi and builds for exactly that under the ordinary
    # per-architecture tag -- so change the number if this machine is not sm_75.
    image: ember:sd-cuda-sm75

    ttl: 4h

    # What the local provider reports for this machine's card, from nvidia-smi.
    # `ember offers` prints it.
    min_vram_gib: 8

    # A Docker named volume: the same code path a rented network volume uses,
    # costing nothing and surviving between runs.
    store:
      name: models
      size_gib: 70
      mount: /models

    assets:
      - url: https://huggingface.co/city96/FLUX.2-dev-gguf/resolve/main/flux2-dev-Q8_0.gguf
        sha256: 09d005300dd8dcbbd489bb75ada6254145c84c2c9c3d7cc1829e3c5dedcb42ce
        as: flux2-dev-Q8_0.gguf
      - url: https://huggingface.co/unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF/resolve/main/Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
        sha256: b2a40e5ef4eab8837d0462c303e8147ec754e2963e41916b551107d2b0ca6527
        as: Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
      - url: https://huggingface.co/black-forest-labs/FLUX.2-small-decoder/resolve/main/full_encoder_small_decoder.safetensors
        sha256: ea4273f02d1fafbf8e1d1c2cf6018ed8748652eb0bf34f2dd91171f16f15ab62
        as: flux2-ae.safetensors

    # present, not always: nothing else writes a Docker volume on this machine,
    # so the cross-run channel the rented path re-hashes 56 GiB against does
    # not exist here -- and re-reading it off this disk before every iteration
    # would make the free path the slow one to start.
    verify: present

    gpu_probe:
      - sh
      - -c
      - "arch=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d ' .'); img=$(cat /etc/ember-cuda-arch 2>/dev/null); echo \"card is sm_$arch, image is sm_$img\"; test -n \"$img\" && test \"$arch\" = \"$img\" && sd-cli --list-devices | grep -qi cuda"
    gpu_probe_timeout: 1m

    sd:
      serve:
        - sd-server
        - --diffusion-model
        - /models/flux2-dev-Q8_0.gguf
        - --llm
        - /models/Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
        - --vae
        - /models/flux2-ae.safetensors

        # The whole reason this entry is possible: 56 GiB of weights in a
        # 125 GiB machine behind an 11 GiB card.
        - --offload-to-cpu

        - --diffusion-fa
        - -v

      # 56 GiB read off this machine's own disk and then streamed into VRAM a
      # layer at a time. Generous, and still a deadline.
      ready_timeout: 20m

      preview: proj
      preview_interval: 5

      jobs:
        - prompt: "A detailed anime illustration of a young woman alone on the open-air platform of a rural railway station at dusk. Cel-shaded with crisp linework, warm rim light from the setting sun behind her, cool blue tones in the shadows."
          sampler: euler
          cfg: 1.0
          guidance: 4.0
          steps: 28

          # 1024, not 1536: the DiT's compute buffer alone was 4412 MiB at
          # 1536x1536 on a card with 80 GiB to spare.
          width: 1024
          height: 1024

          seed: 20261030
          output: local

  # FLUX.2 [dev] on a network volume, one resident server for a list of jobs.
  # This is the entry that spends money.
  - id: flux2
    label: FLUX.2 [dev] (rented)
    driver: sd

    # One image per architecture: this entry names no card, so ember reads the
    # architecture of whichever offer wins the filter. A card with no entry is
    # refused before anything is rented. `ember images` prints this block.
    #
    # `ember store sync --workload flux2` rents a CPU box with this entry's
    # image to populate the store at datacentre bandwidth. A CPU box has no
    # compute capability, so the scalar below is what it gets.
    images:
      sm_75: ghcr.io/legion112/ember-sd:sd-cuda-sm75@sha256:2da9f94d608d2f757dbf2f38f309ce73a6a41b872257c88eb9c2aadd822e20c9
      sm_80: ghcr.io/legion112/ember-sd:sd-cuda-sm80@sha256:468cbde2fdbec8d83e403b32cda8aa4db214c1fd555ddab182225cab7d442f20
      sm_86: ghcr.io/legion112/ember-sd:sd-cuda-sm86@sha256:e7d1e42c94b29146425c134d4d91da646854b8325e5229b790739ecf9f1e8709
      sm_89: ghcr.io/legion112/ember-sd:sd-cuda-sm89@sha256:e4654d841c966b042493d81757feb397817a7e3ff5da8e2bdd397885e901f0c5
      sm_90: ghcr.io/legion112/ember-sd:sd-cuda-sm90@sha256:01be5129dbfc61936bb4c4dff5d3a571838b9e1257dc736427c79324a9c3b69e
      sm_100: ghcr.io/legion112/ember-sd:sd-cuda-sm100@sha256:ef93ef0ee1e6097473a2b36af9ae4066a3ea98912cfde38d4768d8ab60c7883f
      sm_103: ghcr.io/legion112/ember-sd:sd-cuda-sm103@sha256:8ff5fd43523f999a116afe5821bef067290e8d2c2416a13b24a1fef9f4899c88
      sm_120: ghcr.io/legion112/ember-sd:sd-cuda-sm120@sha256:e2447c2d0e884da44c1d33b09abb4366354e606903f2f1dcd8fe2bd835d87f7f
    image: ghcr.io/legion112/ember-node@sha256:70de4503dfeee1ecc09347fb3a8998d293b36ddf67691dd3af925950e787aa2d

    # Four images at roughly a hundred seconds of sampling each, plus about
    # three minutes of setup paid once. Longer than the file's default, because
    # a batch is longer than a single run.
    ttl: 1h

    # Both models resident on one card, which is what makes the second image of
    # a batch cost no load at all.
    min_vram_gib: 80

    store:
      name: flux2
      size_gib: 70
      region: EUR-IS-1
      mount: /models

    assets:
      - url: https://huggingface.co/city96/FLUX.2-dev-gguf/resolve/main/flux2-dev-Q8_0.gguf
        sha256: 09d005300dd8dcbbd489bb75ada6254145c84c2c9c3d7cc1829e3c5dedcb42ce
        as: flux2-dev-Q8_0.gguf
      - url: https://huggingface.co/unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF/resolve/main/Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
        sha256: b2a40e5ef4eab8837d0462c303e8147ec754e2963e41916b551107d2b0ca6527
        as: Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
      - url: https://huggingface.co/black-forest-labs/FLUX.2-small-decoder/resolve/main/full_encoder_small_decoder.safetensors
        sha256: ea4273f02d1fafbf8e1d1c2cf6018ed8748652eb0bf34f2dd91171f16f15ab62
        as: flux2-ae.safetensors

    # always, because a network volume has a cross-run channel this re-hashes
    # 56 GiB against: anything else with the credential can write it between
    # runs, and the weights are what a rented card is about to spend an hour on.
    verify: always

    # The two-question probe, and it runs before sd-server is started -- the
    # cheap-failure order, because a dead card costs the probe timeout rather
    # than the probe timeout plus a 56 GiB model load. `sd-cli --list-devices`
    # alone passes on a wrong-architecture image, because listing devices
    # launches no kernel. An empty /etc/ember-cuda-arch FAILS the test rather
    # than passing it.
    gpu_probe:
      - sh
      - -c
      - "arch=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d ' .'); img=$(cat /etc/ember-cuda-arch 2>/dev/null); echo \"card is sm_$arch, image is sm_$img\"; test -n \"$img\" && test \"$arch\" = \"$img\" && sd-cli --list-devices | grep -qi cuda"
    gpu_probe_timeout: 2m

    sd:
      # No --offload-to-cpu, and the absence is the point: both models stay
      # resident on an 80 GiB card.
      #
      # --diffusion-model and not --model: FLUX.2 names its diffusion model,
      # text encoder and VAE separately.
      serve:
        - sd-server
        - --diffusion-model
        - /models/flux2-dev-Q8_0.gguf
        - --llm
        - /models/Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
        - --vae
        - /models/flux2-ae.safetensors
        - --diffusion-fa
        - -v

      # Longer than the GPU probe's two minutes because the thing being waited
      # for is bigger: 56 GiB read off a network volume before anything is
      # resident.
      ready_timeout: 10m

      preview: proj
      preview_interval: 5

      # Four jobs, one model load. Each lands in the run's output directory as
      # it finishes, so a deadline that arrives early still delivered what it
      # got through. cfg and guidance are different numbers, and conflating
      # them generates at the wrong one.
      jobs:
        - prompt: "A detailed anime illustration of a rural railway station at dusk, an enamel platform sign reading EMBER, warm sodium light, shallow depth of field down the empty tracks, and no other text anywhere in the image."
          width: 1536
          height: 1536
          steps: 28
          sampler: euler
          cfg: 1.0
          guidance: 4.0
          seed: 20261101
          output: station-dusk

        - prompt: "The same rural railway station at night, the enamel sign reading EMBER lit from below, rain on the platform, and no other text anywhere in the image."
          width: 1536
          height: 1536
          steps: 28
          sampler: euler
          cfg: 1.0
          guidance: 4.0
          seed: 20261102
          output: station-night

        # Same prompt, two seeds: the cheapest thing a resident model is good
        # for, because the second one pays no load at all.
        - prompt: "A paper boat on a slow river at morning, soft light, photographic."
          width: 1024
          height: 1024
          steps: 28
          sampler: euler
          cfg: 1.0
          guidance: 4.0
          seed: 1312
          output: boat-a

        - prompt: "A paper boat on a slow river at morning, soft light, photographic."
          width: 1024
          height: 1024
          steps: 28
          sampler: euler
          cfg: 1.0
          guidance: 4.0
          seed: 1313
          output: boat-b

          # Everything the typed fields do not name is reachable through extra,
          # including nested objects. A key ember already set is refused rather
          # than resolved. Reachable from a config and not from the web UI.
          extra:
            output_format: png
