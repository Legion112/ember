# The starter. Copy it to ember.yaml, which every command reads by default.
#
# Safe to commit: no credentials live here. Tokens come from the environment
# (RUNPOD_API_KEY, VAST_API_KEY) or from ~/.config/ember/credentials.yaml at
# mode 0600, which ember refuses to read if it is any looser.
#
# What this file is for, and the four beside it: docs/configurations.md.

provider: runpod

# One container is both the node and the workload, so the image carries sshd
# and embernode. node.Dockerfile builds that base; CI publishes it.
#
# Pinned by digest. A tag can be moved, so two runs a week apart would not
# have measured the same machine -- which is why ember refuses `:latest`.
image: ghcr.io/legion112/ember-node@sha256:70de4503dfeee1ecc09347fb3a8998d293b36ddf67691dd3af925950e787aa2d

# The node destroys itself at this deadline even if ember never gets to,
# which is what stops the bill when the laptop dies mid-run. Mandatory.
ttl: 15m

gpu: rtx4090

# Integer microdollars underneath, so the comparison is exact: a float would
# refuse an offer at exactly the ceiling about as often as it admitted one
# above it. max_hourly_usd bounds the card, max_run_usd the whole rental.
max_hourly_usd: "1.00"
max_run_usd: "0.50"

# max_day_usd and max_month_usd bound every rental in a UTC calendar day or
# month TOGETHER, which neither line above does -- thirty queued requests at
# $0.50 each are inside both and are $15. Read by `ember serve` only, where a
# queue drains unattended, and a request can neither widen nor narrow them.
# Commented out because an unbounded queue is what ember did before they
# existed; set the month one if you set only one.
#
# max_day_usd: "2.00"
# max_month_usd: "20.00"

# name:remote or name:remote:local. Every local end binds 127.0.0.1 and is
# reached over SSH; nothing is published to the internet.
ports:
  - sshd:22:18022

# Paths to retrieve from the node before it dies, as remote or remote:local.
outputs:
  - /etc/hostname:host

# SECURE is RunPod's own hardware and the default. COMMUNITY is cheaper and
# runs on a machine somebody else owns and can see.
runpod_cloud: SECURE

# No cmd, cmds or sd: block, so this holds the node open with its ports
# forwarded -- the interactive shape. Add one of the three and ember runs it,
# brings the outputs home and destroys the node. Never two of them.
