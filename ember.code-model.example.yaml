# ember, serving an open code model to an editor on this machine.
#
# A coding-agent endpoint is `cmd` plus `ports`, and it needed no new code:
# the forwards run *alongside* the workload rather than instead of it, so a
# server as the workload and a forward beside it has always been a supported
# shape. llama-server does not exit, so "a node rented to run something stops
# when it has run it" never fires and the node holds until Ctrl-C, `--hold`,
# or the TTL. The agent runs here and talks to 127.0.0.1:8080, which is
# ember's whole posture already: nothing inbound, everything over SSH.
#
# ONE PIECE OF THIS DOES NOT EXIST, AND IT IS THE IMAGE. An ember workload
# image has to carry embernode and sshd -- ember runs the workload as
# `ssh host command`, so an image that is only a server has nothing to connect
# to -- and this repository builds no such image for an LLM server. So
# `image:` below is not a value, it is a sentence, and ember refuses it by the
# rule that already exists:
#
#   ember: image "EMBER-HAS-NO-LLM-WORKLOAD-IMAGE-SEE-THIS-FILES-HEADER" has
#   no tag: pin it to a tag or a digest, or two runs will not have measured
#   the same software
#
# That is deliberate, and it is #18's lesson applied before it could be
# repeated: ember.video.example.yaml carries REPLACE_WITH_THE_DIGEST_PUSH_
# PRINTS where a digest goes, which reads as a configuration with a typo in
# it. A placeholder has to be unmistakable for a value, and the loudest
# version of that is one whose refusal quotes itself.
#
# EVERYTHING ELSE HERE IS REAL AND RUNNABLE TODAY. `ember store create`,
# `ember store push`, `ember store ls` and `ember store verify` need no node
# and no image, so the store half of this file can be done now and the
# weights are pinned by a digest nobody guessed -- see the asset block.

provider: runpod

# Not a value. See the header. One line to change, and the rest of this file
# is what you keep.
#
# A scalar and not an `images:` map, although a CUDA image is
# per-architecture everywhere else here, because a map is validated entry by
# entry -- ValidateImage and ValidateImageForArch on every one -- and a
# committed map of fiction would fail this repository's own test over every
# other example config at the same time. The fiction is kept where it refuses
# the run and nothing else.
image: EMBER-HAS-NO-LLM-WORKLOAD-IMAGE-SEE-THIS-FILES-HEADER

# A HARD STOP, NOT A SESSION LENGTH, and this is the caveat that matters most
# in the file.
#
# The deadline is written in three places -- the provider's label, the local
# journal record, and the node's own self-destruct timer -- and the third is
# armed from EMBER_TTL_SECONDS, read once by cmd/embernode at container
# start. Nothing on the node listens for a change, so a running node's
# deadline is not re-armable: at 8h the endpoint the editor is pointed at
# disappears, mid-sentence if that is where you are, and the remedy is a new
# node, a new 17 GiB read off the store and a new forward. The ceiling above
# this is node.MaxTTL, a day.
#
# The three copies are the reason it stays that way. AGENTS.md: "three copies
# computed at three call sites are three copies that can disagree, and the one
# that disagrees is the one that does not stop the bill." A re-arm has to
# update all three atomically or it trades the one invariant the money
# discipline rests on for the convenience of not restarting a session.
#
# So pick the number from the working session you actually intend, and know
# that it is also the number max_run_usd is computed against.
ttl: 8h

# The ceilings, and note what the second one is NOT.
#
# max_run_usd is checked against the offer's hourly price times the TTL, at
# selection time, before anything is created. It is a ceiling on the rental,
# not a running meter -- so it cannot bite halfway through a session, and it
# has to be at least max_hourly_usd times ttl or every offer is refused.
#
# An eight-hour working day at $1.00/hour is $8.00, and twenty of them is
# $160 a month for a card that is idle most of those eight hours. That number
# is the point of this configuration as much as the endpoint is: ember exists
# to make the rented path convenient enough that buying hardware becomes a
# decision backed by measurements. This is the workload where renting is
# least favourable, and the measurement that says so is worth having even if
# it argues against doing it.
max_hourly_usd: "1.00"
max_run_usd: "8.00"

# max_day_usd and max_month_usd bound every rental in a UTC calendar day or
# month together, which neither line above does. They are read by `ember
# serve`, where a queue drains unattended; an interactive session is one
# rental the operator started themselves, so they are commented out here.
#
# max_day_usd: "16.00"
# max_month_usd: "200.00"

# 17.28 GiB of weights plus a 32k KV cache does not leave working room on a
# 24 GiB card, and a server that runs out of VRAM forty minutes into a
# session is worse than one that was never rented. 40 GiB is the first size
# that is not a judgement call.
#
# No `gpu:` pin, deliberately: any card with the memory will serve this model
# at a usable rate, and pinning one model would refuse the cheapest offer
# that fits for no reason. `ember offers --min-vram-gib 40` prints what is
# actually rentable at the ceiling above.
min_vram_gib: 40

# A card that cannot initialise does not fail -- it silently becomes a slow
# CPU at the GPU's price. One run lost $0.37 that way (see
# internal/gpucheck), and a chat endpoint is the worst possible place for it:
# a few tokens a second reads as "a big model is slow" rather than as a
# broken card, and nothing in the editor says which it is.
#
# The probe compares the image to the card rather than only asking whether
# the card exists, because asking the driver what hardware is present launches
# no kernel and so exits zero on an image built for another architecture --
# measured: the probe passed, the workload started, and it aborted a second
# into the first generation. An empty /etc/ember-cuda-arch FAILS the test
# rather than passing it: a comparison against nothing admits everything, and
# the LLM image this file is waiting for has to write that file for the same
# reason the sd images do.
#
# There is no second half asking the server itself, the way the sd configs
# run `sd-cli --list-devices`: the equivalent question for a server is
# answered by its own startup log, which streams to this terminal, and a
# probe cannot read it.
gpu_probe:
  - sh
  - -c
  - "arch=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d ' .'); img=$(cat /etc/ember-cuda-arch 2>/dev/null); echo \"card is sm_$arch, image is sm_$img\"; test -n \"$img\" && test \"$arch\" = \"$img\""
gpu_probe_timeout: 1m

# The store, and the monthly charge it is.
#
# 17 GiB of weights is above the layer a registry will accept and would be
# ours alone in any case -- a COPY'd model gets a digest no shared cache can
# hit -- so the weights live on a volume. It bills by the gigabyte-month
# whether or not anything is attached, which makes it the one resource here
# that can leak while every node is correctly destroyed and `ember ls` prints
# a clean bill of health. Naming it here does not create it: that takes
# `ember store create` and an operator who typed it.
#
# The region pins every node that mounts it to one datacentre. EU-RO-1 is the
# widest of the ten that both take a volume and serve the S3 API.
store:
  name: models
  size_gib: 25
  region: EU-RO-1
  mount: /models

# Qwen3-Coder-30B-A3B-Instruct at Q4_K_M: 18,556,689,568 bytes, 17.28 GiB.
# 30B total with about 3B active per token, which is why a card that holds it
# serves it quickly rather than merely holding it.
#
# THE DIGEST WAS NOT GUESSED AND NOT DOWNLOADED. Hugging Face stores LFS
# objects under their own sha256, and two endpoints report it: the tree API's
# `lfs.oid`, and the X-Linked-ETag header on a HEAD of the resolve URL. Both
# answered fadc3e5f... for this file, which is two independent confirmations
# of one number for the cost of two requests and no bytes. That is the
# calibration habit the RunPod volume API set -- ask the service before
# writing the client -- and it is why this file does not carry the
# placeholder #18 is about.
#
#   curl -sI https://huggingface.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/\
#     resolve/main/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf | grep -i linked-etag
#
# Getting it onto the store: `ember store push` uploads from here, bounded by
# this link -- 17.28 GiB at the 67 Mbps measured in README.md is about
# thirty-seven minutes. `ember store sync` rents the cheapest CPU box at
# ~$0.06/hour and has it download instead, which is minutes and a fraction of
# a cent -- but it needs an image, and the one above is fiction, so until that
# exists this is a push.
assets:
  - url: https://huggingface.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/resolve/main/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
    sha256: fadc3e5f8d42bf7e894a785b05082e47daee4df26680389817e2093056f088ad
    as: qwen3-coder-30b-a3b-q4_k_m.gguf

# always, not present, and 17 GiB is why it is affordable.
#
# A store is writable by every node that mounts it, which makes it a channel
# between runs that are otherwise isolated: one workload can leave something
# behind that the next one loads as its model. RunPod offers no read-only
# mount, so the write cannot be prevented and is detected instead. At the
# 868 MiB/s measured off a volume that is about twenty seconds of a card you
# are about to hold for eight hours.
#
# It matters more here than anywhere else in this repository. A substituted
# image model produces a picture that looks wrong; a substituted code model
# produces code, and you paste it.
verify: always

# The workload: one server, held open for the session.
#
# --host 127.0.0.1 IS NOT WHAT KEEPS THIS PRIVATE, and writing 0.0.0.0 here
# would not publish anything either. A workload port is never published:
# exposure.PortRequest's `public` field is unexported, only SSHPort() can set
# it, and a workload port goes through exposure.Internal -- "a port the node
# may listen on but nothing outside may reach". The post-create check
# destroys the node if the provider published anything else. ember now warns
# about a non-loopback bind here rather than refusing it, because `cmd` is
# opaque argv on purpose and a refusal would mean ember claiming to know what
# `--host` means to a program it has never heard of. The warning is about a
# belief, not a hole -- except on the local provider, where the container sits
# on a Docker bridge and a 0.0.0.0 bind really is reachable from this machine
# at the container's address.
#
# NO API KEY ON THIS LINE. /proc/<pid>/cmdline is world-readable, and on a
# rented machine that is every process on it. If the server you pin offers a
# flag that reads a key from a file, that is the one to use, with the file on
# the store; the flag that takes the key itself is the one that leaks it. The
# honest position for this shape is that the endpoint has no authentication
# and does not need any from the network's side, because nothing off this
# machine can reach it -- see "what this does not protect you from" in
# README.md for what it is exposed to instead.
#
# The flag spellings are llama.cpp's. They are a property of the image, which
# is the thing that does not exist yet, so check them against the build you
# end up pinning rather than against this file.
cmd:
  - llama-server
  - --model
  - /models/qwen3-coder-30b-a3b-q4_k_m.gguf
  - --host
  - 127.0.0.1
  - --port
  - "8080"

  # Every layer on the card. The probe above is what makes this a failure
  # rather than a silent fallback when the card is unusable.
  - --n-gpu-layers
  - "999"

  # 32k, not the model's maximum. The KV cache is VRAM, an agent fills a
  # context with repository rather than with conversation, and a window that
  # does not fit is discovered by the server at the moment it stops answering.
  - --ctx-size
  - "32768"

  # Tool calls come out of the model's own chat template rather than out of a
  # generic one. An agent whose tool calls arrive as prose reads as a model
  # that cannot use tools.
  - --jinja

  - --alias
  - qwen3-coder-30b

# The forward: 127.0.0.1:8080 here, the node's own loopback there.
#
# Loopback on both ends, and neither end is configurable. The local end can
# only be named through loopback.Bind, whose field is unexported, and both
# families are bound so a browser or client that resolves localhost to ::1
# first is not left reading connection-refused on a working tunnel. The
# remote end is built by tunnel.RemoteLoopback(port), which takes a port and
# not an address: SSH's direct-tcpip will connect anywhere the node can reach
# -- another tenant, the provider's metadata service, the open internet -- so
# a free-form remote host would turn every ember node into an open relay
# billed to the operator.
#
# Point the editor or the agent at http://127.0.0.1:8080/v1. `ember up`
# prints the ready line only once the far side accepts through the tunnel,
# because a refused request on a working forward is the most likely false bug
# report this program can produce.
ports:
  - llm:8080

# No `outputs:`. An interactive session's product is in the editor and on this
# machine already, and the node's own log comes home regardless. An empty
# fetch would be a tar over a path nothing wrote.
