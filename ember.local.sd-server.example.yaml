# ember's web UI, on this machine, for nothing.
#
# `ember serve` needs an sd: block, because the serve argv names the weights
# and a request arriving over HTTP may not. This is the one committed example
# that provides one and costs nothing.
#
#   make docker-build
#   make workload-sd MODEL=/path/to/v1-5-pruned_bf16.gguf
#   make web
#   ember serve --config ember.local.sd-server.example.yaml
#
# WHAT IT PROVES beyond convenience, and why each timeout differs from the
# rented path's: docs/configurations.md.

provider: local

# The CPU build. It carries sd-server beside sd-cli and a baked sd15, which is
# what makes this free. A scalar image: and not an images: map, because a
# local run has exactly one machine and knows what is in it.
image: ember:sd

# Generous for a laptop and still a deadline. There is no such thing as a run
# without one: `ember serve` holds a rental for as long as there is queued
# work, and the TTL is what bounds that if something wedges.
ttl: 30m

# The web UI shows these as the ceilings a request may narrow and never widen.
# Both are nominal here -- the local provider is free -- and are written out
# so the UI has something to display and the shape is copyable to a
# configuration that is not free.
max_hourly_usd: "0.50"
max_run_usd: "0.25"

sd:
  # ember appends --listen-ip 127.0.0.1 --listen-port 1234 itself and refuses
  # a serve command that names either.
  #
  # --model and NOT --diffusion-model: this is a whole checkpoint in one file.
  # --diffusion-model is for a standalone DiT, which is what FLUX.2 needs, and
  # the flag that works for one silently cannot load the other.
  serve:
    - sd-server
    - --model
    - /opt/models/sd15.gguf

  # A laptop CPU loads sd15 in a few seconds. The ten-minute default is right
  # for 56 GiB off a network volume and far too patient here: a server that
  # died wants noticing now, not at the deadline.
  ready_timeout: 2m

  # `proj` projects the latent rather than decoding it, so it costs almost
  # nothing per frame; tae and vae run a real decode. Every 2 steps rather
  # than ember's usual 5, because a generation here is short enough that 5
  # would produce one frame and nothing to watch.
  preview: proj
  preview_interval: 2

  # `ember serve` replaces this with whatever the browser queues, so it is a
  # placeholder -- but it cannot be empty: ParseSD refuses a server with no
  # jobs, because that configuration rents a card, loads the weights and
  # generates nothing. It is also what `ember up` on this file would run.
  jobs:
    - prompt: "a rural railway station at dusk, warm light, cel-shaded"
      width: 384
      height: 384
      steps: 20
      sampler: euler
      seed: 20261101
      output: station
