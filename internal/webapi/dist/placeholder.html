<h1>ember</h1>
<p>The web UI was not built into this binary.</p>
<p>Build it with <code>make web</code>, then start <code>ember serve</code> again. The JSON
API under <code>/api/</code> works either way.</p>
<!--
  THIS FILE IS A PLACEHOLDER AND IS COMMITTED ON PURPOSE.

  //go:embed fails at *compile* time when its pattern matches nothing, so
  without a file here `go build ./...`, `go vet ./...`, `make test`,
  `make cover-check` and every step of CI would fail for anyone who had not
  first run a Rust build. The Go toolchain must not depend on the Rust one.

  IT IS NOT CALLED index.html, which is the part worth explaining. `make web`
  writes a real index.html beside this file, and if that were the same name
  then building the UI would leave the repository dirty and the tests about
  this placeholder would pass or fail depending on whether somebody had run
  `make web` -- which is exactly the "behaves differently from one machine to
  the next" problem AGENTS.md is written against. So the server serves
  index.html when there is one and this when there is not, and `make web`'s
  output is gitignored.
