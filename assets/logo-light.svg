<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-label="ember">
  <title>ember</title>
  <defs>
    <radialGradient id="coal" cx="50%" cy="58%" r="55%">
      <stop offset="0%"   stop-color="#FFEFC0"/>
      <stop offset="30%"  stop-color="#FFB24D"/>
      <stop offset="62%"  stop-color="#F2660A"/>
      <stop offset="100%" stop-color="#B51A14"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="56%" r="50%">
      <stop offset="0%"   stop-color="#FF8A1F" stop-opacity=".55"/>
      <stop offset="55%"  stop-color="#FF6A0A" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FF6A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8C8F96"/>
      <stop offset="100%" stop-color="#5A5D64"/>
    </linearGradient>
  </defs>
  <g transform="translate(4,4)">

  <!-- package pins: the silicon half of the metaphor -->
  <g stroke="url(#die)" stroke-width="3" stroke-linecap="round">
    <path d="M24 6v6M32 6v6M40 6v6"/>
    <path d="M24 52v6M32 52v6M40 52v6"/>
    <path d="M6 24h6M6 32h6M6 40h6"/>
    <path d="M52 24h6M52 32h6M52 40h6"/>
  </g>

  <!-- the die -->
  <rect x="12" y="12" width="40" height="40" rx="9"
        fill="none" stroke="url(#die)" stroke-width="3"/>

  <!-- heat around the coal. A gradient rather than a blur filter: a filter
       region is a rectangle, and on a dark background its soft edge reads as
       a grey box sitting inside the die. -->
  <circle cx="32" cy="33" r="15" fill="url(#halo)"/>

  <!-- the ember: hot at the core, cooling at the edge -->
  <path d="M32 21c5.1 3.3 8.4 7.1 8.4 11.6 0 5.2-3.8 9.4-8.4 9.4s-8.4-4.2-8.4-9.4c0-2 .8-3.6 2-4.6.2 1.7 1 2.9 2.2 3.3-.5-3.9.8-7.5 4.2-10.3z"
        fill="url(#coal)"/>
  </g>
  <text x="86" y="47"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="600" letter-spacing="-0.5" fill="#15181D">ember</text>
  <text x="88" y="63"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="11" letter-spacing="1.6" fill="#6B7076">RENT &#183; RUN &#183; DESTROY</text>
</svg>
