# ember, several images from one resident model.
#
# The same weights and the same card as ember.flux2.yaml, driven the other
# way: that file runs one sd-cli per `ember up`, this one starts one
# sd-server and sends it a list of jobs.
#
# WHAT THIS BUYS, AND WHAT IT DOES NOT. `cmds` already removed the costs that
# are paid per rental -- waiting for the machine, pulling the image, reading
# and verifying 56 GiB off the store. What it cannot remove is the model load,
# because every entry in `cmds` is a fresh process that reads the weights into
# VRAM again. On a rented A100 that is about twelve seconds per image during
# which nothing is being generated. For ten 1536x1536 images at roughly a
# hundred seconds each, removing it is about eight percent.
#
# It is worth much more the other way round. On short generations -- prompt
# iteration at 512x512, four steps -- the reload is most of the step rather
# than a tenth of it, and that is the case this shape exists for.
#
# NOTHING HERE HAS BEEN RUN END TO END YET. The numbers above come from
# ember.flux2.yaml's measured per-rental figures and from #7's table; the
# eight percent is arithmetic, not a measurement. The first real run is a
# calibration rather than a lab -- it costs money, and what it produces is a
# number and a set of fixtures. ember.video.example.yaml carries the same
# warning for the same reason.
#
# LICENSE: FLUX.2 [dev] is non-commercial. The weights and anything generated
# from them carry that restriction; this repository's MIT licence does not
# extend to the output of this file.

provider: runpod

# One image per architecture, exactly as ember.flux2.yaml explains: this
# configuration names no card, so ember reads the architecture of whichever
# offer wins the filter and uses that entry. A card with no entry is refused
# before anything is rented.
#
# `ember images` prints this block; the publish workflow's report job runs it.
images:
  sm_75: ghcr.io/legion112/ember-sd:sd-cuda-sm75@sha256:2da9f94d608d2f757dbf2f38f309ce73a6a41b872257c88eb9c2aadd822e20c9
  sm_80: ghcr.io/legion112/ember-sd:sd-cuda-sm80@sha256:468cbde2fdbec8d83e403b32cda8aa4db214c1fd555ddab182225cab7d442f20
  sm_86: ghcr.io/legion112/ember-sd:sd-cuda-sm86@sha256:e7d1e42c94b29146425c134d4d91da646854b8325e5229b790739ecf9f1e8709
  sm_89: ghcr.io/legion112/ember-sd:sd-cuda-sm89@sha256:e4654d841c966b042493d81757feb397817a7e3ff5da8e2bdd397885e901f0c5
  sm_90: ghcr.io/legion112/ember-sd:sd-cuda-sm90@sha256:01be5129dbfc61936bb4c4dff5d3a571838b9e1257dc736427c79324a9c3b69e
  sm_100: ghcr.io/legion112/ember-sd:sd-cuda-sm100@sha256:ef93ef0ee1e6097473a2b36af9ae4066a3ea98912cfde38d4768d8ab60c7883f
  sm_103: ghcr.io/legion112/ember-sd:sd-cuda-sm103@sha256:8ff5fd43523f999a116afe5821bef067290e8d2c2416a13b24a1fef9f4899c88
  sm_120: ghcr.io/legion112/ember-sd:sd-cuda-sm120@sha256:e2447c2d0e884da44c1d33b09abb4366354e606903f2f1dcd8fe2bd835d87f7f

# Four images at roughly a hundred seconds of sampling each, plus about three
# minutes of setup paid once. The ceiling is what stops a batch that wedged
# from billing until somebody notices, so it is set from the job rather than
# left at a default -- and a batch is longer than a single run, which is the
# one thing about TTL that changes here.
ttl: 1h
min_vram_gib: 80
max_hourly_usd: "2.60"
max_run_usd: "3.00"

store:
  name: flux2
  size_gib: 70
  region: EUR-IS-1
  mount: /models

assets:
  - url: https://huggingface.co/city96/FLUX.2-dev-gguf/resolve/main/flux2-dev-Q8_0.gguf
    sha256: 09d005300dd8dcbbd489bb75ada6254145c84c2c9c3d7cc1829e3c5dedcb42ce
    as: flux2-dev-Q8_0.gguf
  - url: https://huggingface.co/unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF/resolve/main/Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
    sha256: b2a40e5ef4eab8837d0462c303e8147ec754e2963e41916b551107d2b0ca6527
    as: Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
  - url: https://huggingface.co/black-forest-labs/FLUX.2-small-decoder/resolve/main/full_encoder_small_decoder.safetensors
    sha256: ea4273f02d1fafbf8e1d1c2cf6018ed8748652eb0bf34f2dd91171f16f15ab62
    as: flux2-ae.safetensors

verify: always

# The same probe ember.flux2.yaml carries, and for the same two reasons: a
# card that cannot initialise is a billed CPU, and a wrong-architecture image
# aborts after the weights are fetched. Note that it compares the image's
# architecture to the card's -- `sd-cli --list-devices` alone passes on a
# wrong-architecture image, because listing devices launches no kernel.
#
# It runs before sd-server is started, which is the cheap-failure order: a
# dead card costs the probe timeout rather than the probe timeout plus a
# 56 GiB model load.
gpu_probe:
  - sh
  - -c
  - "arch=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d ' .'); img=$(cat /etc/ember-cuda-arch 2>/dev/null); echo \"card is sm_$arch, image is sm_$img\"; test -n \"$img\" && test \"$arch\" = \"$img\" && sd-cli --list-devices | grep -qi cuda"
gpu_probe_timeout: 2m

sd:
  # ember appends --listen-ip 127.0.0.1 --listen-port 1234 itself, and refuses
  # a serve command that names either. sd-server is reached over the SSH
  # connection; a config choosing 0.0.0.0 would publish an unauthenticated
  # generator on a rented machine's public interface.
  #
  # No --offload-to-cpu, and the absence is the point: every example in
  # upstream's docs passes it because upstream is testing on hardware that has
  # to. Both models stay resident on an 80 GiB card.
  serve:
    - sd-server
    - --diffusion-model
    - /models/flux2-dev-Q8_0.gguf
    - --llm
    - /models/Mistral-Small-3.2-24B-Instruct-2506-Q8_0.gguf
    - --vae
    - /models/flux2-ae.safetensors
    - --diffusion-fa
    - -v

  # Longer than the GPU probe's two minutes because the thing being waited for
  # is bigger: 56 GiB read off a network volume, measured at about a gigabyte
  # a second, before anything is resident. ember prints what sd-server itself
  # reports it spent, which is the figure this whole shape exists to pay once.
  ready_timeout: 10m

  # ember's defaults, written out here so they can be read. Upstream defaults
  # the interval to 1 -- a frame every single step -- and tae and vae run a
  # decode to produce each frame, so the upstream default is the expensive one
  # on a card billing by the second. `proj` is a projection rather than a
  # decode. Use `none` for a batch nobody is watching.
  preview: proj
  preview_interval: 5

  # Four jobs, one model load. Each lands in the run's output directory as it
  # finishes, so a deadline that arrives early still delivered what it got
  # through -- and an operator watching the accumulating price can stop paying
  # for the rest.
  #
  # cfg and guidance are different numbers: cfg-scale 1 and guidance 4 is what
  # examples/server/recipes/flux2-dev.json sets, and conflating them generates
  # at the wrong one.
  jobs:
    - prompt: "A detailed anime illustration of a rural railway station at dusk, an enamel platform sign reading EMBER, warm sodium light, shallow depth of field down the empty tracks, and no other text anywhere in the image."
      width: 1536
      height: 1536
      steps: 28
      sampler: euler
      cfg: 1.0
      guidance: 4.0
      seed: 20261101
      output: station-dusk

    - prompt: "The same rural railway station at night, the enamel sign reading EMBER lit from below, rain on the platform, and no other text anywhere in the image."
      width: 1536
      height: 1536
      steps: 28
      sampler: euler
      cfg: 1.0
      guidance: 4.0
      seed: 20261102
      output: station-night

    # Same prompt, two seeds: the cheapest thing a resident model is good for,
    # because the second one pays no load at all.
    - prompt: "A paper boat on a slow river at morning, soft light, photographic."
      width: 1024
      height: 1024
      steps: 28
      sampler: euler
      cfg: 1.0
      guidance: 4.0
      seed: 1312
      output: boat-a

    - prompt: "A paper boat on a slow river at morning, soft light, photographic."
      width: 1024
      height: 1024
      steps: 28
      sampler: euler
      cfg: 1.0
      guidance: 4.0
      seed: 1313
      output: boat-b

      # Everything the typed fields above do not name is reachable through
      # extra, including nested objects, so no part of the API is out of
      # reach from a config. A key ember already set is refused rather than
      # resolved.
      extra:
        output_format: png

# The server's own log, fetched once at the end. The images do not come this
# way -- they arrive in the HTTP response as each job finishes, and are written
# straight into the run's output directory.
#
# /workspace and never the store: anything written to a mounted volume bills
# by the month for as long as the store exists.
outputs:
  - /workspace/out:logs
