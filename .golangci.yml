version: "2"

run:
  timeout: 5m
  # EVERY BUILD TAG IN THE TREE GOES HERE. The tags are set in the config
  # rather than passed on a command line, because CI lints through
  # golangci-lint-action and the action reads this file -- so a tag missing
  # here is a tree linted nowhere, and it drifts until somebody types the tag
  # by hand.
  #
  # The rule is the list, not the entries. This comment used to argue for
  # `integration` alone, which is the right argument and cannot catch the tag
  # somebody forgets: `imagelab` was added to `go vet` in three places and not
  # to this one, so the image labs -- which are what stops a bad workload
  # image reaching a registry -- went unlinted for their whole life, with an
  # unchecked error and a dead helper sitting in them. Same shape as the
  # journal subdirectory that was spelled in two places until a lab read the
  # wrong one.
  #
  # cmd/check-coverage's TestEveryBuildTagReachesTheGates now walks the tree,
  # parses the constraints and fails when a tag is missing from here or from
  # the Makefile's LAB_TAGS, so the next tag cannot be a silent gap in either.
  build-tags:
    - integration
    - imagelab

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    # unused finds a declaration nothing references. It cannot find a
    # declaration only *tests* reference, which is the defect AGENTS.md has
    # counted nine times -- and it cannot be configured to, which was checked
    # before cmd/check-coverage's TestNoProductionDeadCode was written rather
    # than assumed:
    #
    #   - golangci-lint v2.15.0's schema accepts exactly
    #     exported-fields-are-used, parameters-are-used,
    #     local-variables-are-used, field-writes-are-uses,
    #     post-statements-are-reads and generated-is-used. staticcheck's
    #     `whole-program` and `check-exported` are refused outright.
    #   - The only lever is the global `run.tests: false`, which is not a
    #     setting on this linter: it stops *every* linter looking at test
    #     files, and the exclusions below are scoped to `_test.go` precisely
    #     because they are looked at. Run that way on a clean tree it reported
    #     one symbol, `(*Queue).out`, which is also the one the real detector
    #     found -- because `unused` reports only unexported identifiers in a
    #     non-main package, and five of the nine instances were exported.
    #
    # So the two are complementary and both stay: this one reads reachability
    # within a package, the guard reads it across the production/test line.
    - unused
    # The three beyond the usual set, each earning its place in this project:
    # gosec because ember handles private keys and opens sockets; bodyclose
    # because every provider is an HTTP client and a leaked body is a leaked
    # connection that eventually stalls a poll loop; errorlint because the
    # provider sentinels in internal/node are matched with errors.Is and a
    # stray == comparison would silently stop matching once anything wraps.
    - gosec
    - bodyclose
    - errorlint
  exclusions:
    generated: lax
    rules:
      # gosec's filesystem rules (G301/G302/G304) are about shipped code. The
      # tests here deliberately create group-readable keys and world-writable
      # directories, because the behaviour under test is ember *refusing*
      # them: suppressing line by line would mean a nolint on every assertion
      # that matters.
      - path: _test\.go
        linters:
          - gosec

      # The lab harness is test support that happens not to live in _test.go
      # files, because the labs import it as a package. Its whole job is to
      # launch ember as a subprocess (G204) at a path it computed (G703), and
      # those paths come from t.TempDir and the Makefile rather than from any
      # input. Scoped to this one directory, and to gosec only, so the rest of
      # the tagged tree is linted like anything else.
      - path: ^test/integration/harness/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
